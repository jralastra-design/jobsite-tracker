<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jobsite Tracker</title>
<meta name="theme-color" content="#14181B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
</head>
<body>
<header class="top"><div class="wrap">
  <span class="jobno" id="hJob">L&amp;H</span>
  <span class="jobname" id="hName">Jobsite Tracker</span>
  <select id="projSel" aria-label="Switch project" hidden></select>
  <span id="syncChip" class="sync ok" role="status"></span>
  <button id="acctBtn" class="acct" aria-label="Account"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
</div></header>
<main><div class="wrap" id="main"><div class="panel pad"><div class="eyebrow">Starting</div><p class="muted">Loading…</p></div></div></main>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div id="sheetRoot"></div>
<div id="toast" hidden></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
